[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-harness-launcher"
version = "0.2.0rc1"
description = "Launcher for the published Forge Rust coding agent"
requires-python = ">=3.9"

[project.scripts]
forge = "forge_harness_launcher:main"

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["forge_harness_launcher"]
